<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSE Company Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel-2:#171c22; --line:#242b33;
    --text:#e7eaee; --muted:#8a94a1; --accent:#3ddc97; --neg:#ff5d5d;
    --neu:#f0b429; --brand:#5aa9ff; --gold:#c9a227;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(90,169,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(61,220,151,0.08), transparent 55%),
      var(--bg);
    color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
  }
  ::selection{ background:var(--accent); color:#04150e; }

  /* ---- marquee ---- */
  .tape{ border-bottom:1px solid var(--line); background:var(--panel); overflow:hidden; white-space:nowrap; padding:9px 0; min-height:34px; }
  .tape-track{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    letter-spacing:0.02em; color:var(--muted); animation:scroll 90s linear infinite; padding-left:100%;
  }
  .tape-track span{ margin-right:34px; }
  .tape-track .up{ color:var(--accent); }
  .tape-track .down{ color:var(--neg); }
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-100%);} }

  header{ max-width:900px; margin:0 auto; padding:6px 24px 2px; text-align:center; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--brand); margin-bottom:3px; }
  h1{ font-family:'Archivo',sans-serif; font-weight:700; font-size:clamp(13px,1.6vw,15px); margin:0; letter-spacing:-0.005em; line-height:1.3; color:var(--muted); }
  h1 .hl{ color:var(--accent); }
  .sub{ color:var(--muted); font-size:15px; max-width:560px; margin:0 auto; line-height:1.5; }

  /* ---- search ---- */
  .search-wrap{ max-width:640px; margin:22px auto 0; padding:0 24px; position:relative; }
  .search-box{
    display:flex; align-items:center; gap:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:14px 18px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-box:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(61,220,151,0.14); }
  .search-box svg{ flex-shrink:0; color:var(--muted); }
  #q{ flex:1; background:none; border:none; outline:none; color:var(--text); font-size:16px; font-family:'Inter',sans-serif; }
  #q::placeholder{ color:#5b6572; }
  .kbd{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:2px 6px; }

  .clear-btn{
    display:none; align-items:center; justify-content:center; flex-shrink:0; width:26px; height:26px;
    border-radius:50%; color:var(--muted); cursor:pointer; transition:all .12s ease;
  }
  .clear-btn:hover{ background:var(--panel-2); color:var(--text); }
  body.search-active .clear-btn{ display:flex; }
  body.search-active .kbd{ display:none; }

  /* header + dashboard are the "normal" overview; hidden while a search result is open */
  body.search-active #pageHeader,
  body.search-active #dashWrap{ display:none; }

  .suggest{
    position:absolute; left:24px; right:24px; top:calc(100% + 8px); background:var(--panel-2);
    border:1px solid var(--line); border-radius:12px; overflow:hidden; max-height:340px;
    overflow-y:auto; display:none; z-index:20; box-shadow:0 20px 40px rgba(0,0,0,0.4);
  }
  .suggest.show{ display:block; }
  .suggest-item{ padding:11px 18px; font-size:14.5px; cursor:pointer; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .suggest-item:last-child{ border-bottom:none; }
  .suggest-item:hover, .suggest-item.active{ background:rgba(61,220,151,0.08); }
  .suggest-item .cnt{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); flex-shrink:0; }
  .suggest-empty{ padding:16px 18px; color:var(--muted); font-size:14px; }
  .suggest-left{ display:flex; align-items:baseline; gap:9px; min-width:0; overflow:hidden; }
  .suggest-left .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sym-badge{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--brand);
    background:rgba(90,169,255,0.10); border-radius:5px; padding:1px 6px; flex-shrink:0;
  }

  main{ max-width:800px; margin:0 auto; padding:16px 24px 24px; min-height:20px; }

  /* ---- back-to-overview button (shown at the top of a company/news result) ---- */
  .back-row{ margin-bottom:16px; }
  .back-btn{
    display:inline-flex; align-items:center; gap:7px; font-family:'IBM Plex Mono',monospace;
    font-size:13px; color:var(--muted); background:var(--panel); border:1px solid var(--line);
    border-radius:9px; padding:8px 14px; cursor:pointer; transition:all .12s ease; user-select:none;
  }
  .back-btn:hover{ color:var(--text); border-color:var(--brand); }

  /* ---- dashboard: 3-day / 5-day rising + latest news, tabbed ---- */
  .dash-wrap{ max-width:1180px; margin:0 auto; padding:0 24px 8px; }

  .dash-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .dash-tab{
    display:flex; align-items:center; gap:8px; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:13.5px; color:var(--muted); background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 16px; cursor:pointer; transition:all .12s ease; user-select:none;
  }
  .dash-tab:hover{ color:var(--text); border-color:#33404c; }
  .dash-tab .arrow-up{ color:var(--accent); }
  .dash-tab .dash-tab-count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
  .dash-tab.active{ background:rgba(61,220,151,0.10); border-color:var(--accent); color:var(--text); }
  .dash-tab.active .dash-tab-count{ color:var(--accent); }

  .dash-panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:none; }
  .dash-panel.active{ display:block; }
  .dash-panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .dash-panel-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:7px; }
  .dash-panel-title .arrow-up{ color:var(--accent); }
  .dash-panel-count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
  .dash-panel-body{ max-height:460px; overflow-y:auto; }
  .dash-empty{ padding:22px 16px; color:var(--muted); font-size:13px; font-family:'IBM Plex Mono',monospace; }

  /* full-width table look for the trend panels, like the reference screenshot */
  .trend-table{ width:100%; border-collapse:collapse; }
  .trend-table thead th{
    position:sticky; top:0; background:var(--panel-2); text-align:left; font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:500;
    padding:10px 16px; border-bottom:1px solid var(--line);
  }
  .trend-table thead th.num{ text-align:right; }
  .trend-table td{ padding:11px 16px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .trend-table td.num{ text-align:right; }
  .trend-table tbody tr{ cursor:pointer; transition:background .12s ease; }
  .trend-table tbody tr:hover{ background:var(--panel-2); }
  .trend-table tbody tr:last-child td{ border-bottom:none; }
  .trend-table .sym{ font-weight:600; color:var(--text); }
  .trend-table .cname{ display:block; font-family:'Inter',sans-serif; font-size:11px; color:var(--muted); margin-top:2px; }
  .trend-table .cmp-val{ color:var(--accent); }
  .trend-table .cmp-val.flash-up{ animation:flashUp .9s ease; }
  .trend-table .cmp-val.flash-down{ animation:flashDown .9s ease; }

  .trend-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s ease;
  }
  .trend-row:last-child{ border-bottom:none; }
  .trend-row:hover{ background:var(--panel-2); }
  .trend-left{ min-width:0; }
  .trend-symbol{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px; color:var(--text); }
  .trend-name{ font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .trend-right{ text-align:right; font-family:'IBM Plex Mono',monospace; }
  .trend-cmp{ font-size:13.5px; color:var(--accent); }
  .trend-support{ font-size:10.5px; color:var(--muted); }

  .news-row{ padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s ease; }
  .news-row:last-child{ border-bottom:none; }
  .news-row:hover{ background:var(--panel-2); }
  .news-row-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .news-row-company{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px; color:var(--brand); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .news-row-date{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); flex-shrink:0; }
  .news-row-tags{ display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
  .news-row-summary{ font-size:12.5px; color:#cdd3da; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* ---- quote card ---- */
  .quote-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:24px 26px; margin-bottom:28px; display:none;
  }
  .quote-card.show{ display:block; }
  .quote-top{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .quote-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .quote-name .sym-badge{ font-size:13px; padding:2px 9px; }
  .quote-cmp{ font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600; text-align:right; transition:color .3s ease; }
  .quote-cmp.flash-up{ animation:flashUp 1s ease; }
  .quote-cmp.flash-down{ animation:flashDown 1s ease; }
  .quote-note{ color:var(--muted); font-size:12.5px; margin-top:10px; font-family:'IBM Plex Mono',monospace; display:flex; align-items:center; gap:6px; }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; box-shadow:0 0 0 0 rgba(61,220,151,0.5); animation:pulse 2s infinite; }
  .live-dot.stale{ background:var(--muted); box-shadow:none; animation:none; }

  .trend-badge{
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; letter-spacing:0.02em;
    padding:3px 10px; border-radius:999px; border:1px solid transparent; white-space:nowrap;
  }
  .trend-badge.up{ color:var(--accent); border-color:var(--accent); background:rgba(61,220,151,0.10); }
  .trend-badge.down{ color:var(--neg); border-color:var(--neg); background:rgba(255,93,93,0.10); }
  .trend-badge.side{ color:var(--neu); border-color:var(--neu); background:rgba(240,180,41,0.10); }

  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(61,220,151,0.5); }
    70%{ box-shadow:0 0 0 6px rgba(61,220,151,0); }
    100%{ box-shadow:0 0 0 0 rgba(61,220,151,0); }
  }
  @keyframes flashUp{ 0%{ background:rgba(61,220,151,0.22); } 100%{ background:transparent; } }
  @keyframes flashDown{ 0%{ background:rgba(255,93,93,0.22); } 100%{ background:transparent; } }

  .stat-row{ display:flex; gap:14px; margin-top:18px; flex-wrap:wrap; }
  .stat{ background:#0f1420; border:1px solid var(--line); border-radius:10px; padding:11px 16px; flex:1; min-width:130px; }
  .stat .label{ color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; font-family:'IBM Plex Mono',monospace; }
  .stat .value{ font-family:'IBM Plex Mono',monospace; font-size:18px; margin-top:5px; }



  /* ---- news feed ---- */
  .result-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .result-head h2{ font-family:'Archivo',sans-serif; font-size:21px; font-weight:700; margin:0; }
  .result-count{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted); white-space:nowrap; }

  .feed{ position:relative; }
  .feed::before{ content:''; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:var(--line); }
  .card{ position:relative; padding:4px 0 24px 30px; }
  .dot{ position:absolute; left:0; top:8px; width:11px; height:11px; border-radius:50%; background:var(--panel); border:2px solid var(--muted); }
  .dot.positive{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(61,220,151,0.15); }
  .dot.negative{ border-color:var(--neg); box-shadow:0 0 0 3px rgba(255,93,93,0.15); }
  .dot.neutral,.dot.unknown{ border-color:var(--neu); box-shadow:0 0 0 3px rgba(240,180,41,0.12); }

  .card-top{ display:flex; align-items:center; gap:8px; margin-bottom:7px; flex-wrap:wrap; }
  .date{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text); font-weight:500; margin-right:4px; }
  .tag{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; padding:2px 8px; border-radius:999px; font-weight:500; border:1px solid transparent; }
  .tag.sentiment.positive{ background:rgba(61,220,151,0.12); color:var(--accent); }
  .tag.sentiment.negative{ background:rgba(255,93,93,0.12); color:var(--neg); }
  .tag.sentiment.neutral,.tag.sentiment.unknown{ background:rgba(240,180,41,0.10); color:var(--neu); }

  .tag.category{ background:none; }
  .tag.category.Penalty{ color:var(--neg); border-color:var(--neg); }
  .tag.category.Dividend{ color:var(--accent); border-color:var(--accent); }
  .tag.category.AGM_or_EGM{ color:var(--brand); border-color:var(--brand); }
  .tag.category.Financial_Results{ color:var(--gold); border-color:var(--gold); }
  .tag.category.Others{ color:var(--muted); border-color:var(--line); }

  .summary{ font-size:15px; line-height:1.6; color:#cdd3da; margin:0; }

  .empty-state, .loading-state{ text-align:center; padding:60px 20px; color:var(--muted); }
  .intro-state{ text-align:center; padding:20px 20px 8px; color:var(--muted); }
  .intro-state .big{ font-size:28px; margin-bottom:8px; }
  .intro-state p{ font-size:13.5px; max-width:400px; margin:0 auto; line-height:1.5; }
  .try-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .try-chip{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text); background:var(--panel); border:1px solid var(--line); padding:6px 12px; border-radius:8px; cursor:pointer; }
  .try-chip:hover{ border-color:var(--brand); color:var(--brand); }

  footer{ text-align:center; color:#4a525c; font-size:12px; padding:20px; font-family:'IBM Plex Mono',monospace; }

  @media (max-width:520px){
    header{ padding:36px 18px 18px; }
    main{ padding:28px 18px 80px; }
  }
</style>
</head>
<body>

  <div class="tape"><div class="tape-track" id="tapeTrack"></div></div>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="text" placeholder="Try “Tata”, “TCS”, “RELIANCE”…" autocomplete="off" />
      <span class="clear-btn" id="clearBtn" title="Close / back to overview">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </span>
      <span class="kbd" id="kbdHint">↵</span>
    </div>
    <div class="suggest" id="suggest"></div>
  </div>

  <main id="main">
    <div class="intro-state" id="introState">
      <div class="big">📈</div>
      <p>Start typing a company name or NSE symbol above. We'll pull its price, news and sentiment together.</p>
      <div class="try-row" id="tryRow"></div>
    </div>
  </main>

  <header id="pageHeader">
    <div class="eyebrow">Company Terminal</div>
    <h1>Search a company or symbol. <span class="hl">Price, news &amp; sentiment</span> — in one place.</h1>
  </header>

  <div class="dash-wrap" id="dashWrap">
    <div class="dash-tabs" id="dashTabs">
      <div class="dash-tab active" data-panel="trend3">
        <span class="arrow-up">▲</span> 3-Day Rising <span class="dash-tab-count" id="trend3Count"></span>
      </div>
      <div class="dash-tab" data-panel="trend5">
        <span class="arrow-up">▲▲</span> 5-Day Rising <span class="dash-tab-count" id="trend5Count"></span>
      </div>
      <div class="dash-tab" data-panel="latestNews">
        📰 Latest News <span class="dash-tab-count" id="latestNewsCount"></span>
      </div>
    </div>

    <div class="dash-panel active" id="trend3Panel">
      <div class="dash-panel-body" id="trend3Body"><div class="dash-empty">Loading…</div></div>
    </div>
    <div class="dash-panel" id="trend5Panel">
      <div class="dash-panel-body" id="trend5Body"><div class="dash-empty">Loading…</div></div>
    </div>
    <div class="dash-panel" id="latestNewsPanel">
      <div class="dash-panel-body" id="latestNewsBody"><div class="dash-empty">Loading…</div></div>
    </div>
  </div>

  <footer id="footerLine"></footer>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
(function(){
  let currentMatches = [];
  let activeIndex = -1;
  let currentSymbol = null;   // symbol of the company currently shown in the quote card
  const liveCmpBySymbol = {}; // latest live price we've received per symbol, kept for late-rendered rows

  const qEl = document.getElementById('q');
  const suggestEl = document.getElementById('suggest');
  const main = document.getElementById('main');
  const clearBtn = document.getElementById('clearBtn');
  let companyList = [];

  fetch('/api/stats').then(r=>r.json()).then(stats=>{
    document.getElementById('footerLine').textContent =
      stats.companies.toLocaleString() + ' companies · ' + stats.articles.toLocaleString() + ' articles';
  });

  fetch('/api/companies').then(r=>r.json()).then(list=>{
    companyList = list;
    buildTape(list);
    buildTryChips(list);
  });

  function showIntro(){
    main.innerHTML =
      '<div class="intro-state" id="introState">' +
        '<div class="big">📈</div>' +
        '<p>Start typing a company name or NSE symbol above. We\'ll pull its price, news and sentiment together.</p>' +
        '<div class="try-row" id="tryRow"></div>' +
      '</div>';
    if(companyList.length) buildTryChips(companyList);
  }

  function closeSearch(){
    qEl.value = '';
    suggestEl.classList.remove('show');
    document.body.classList.remove('search-active');
    currentSymbol = null;
    showIntro();
    window.scrollTo({top:0, behavior:'smooth'});
  }
  clearBtn.addEventListener('click', closeSearch);

  // ---- dashboard tabs: 3-day / 5-day rising + latest news ----
  document.getElementById('dashTabs').addEventListener('click', (e)=>{
    const tab = e.target.closest('.dash-tab');
    if(!tab) return;
    const target = tab.dataset.panel;
    document.querySelectorAll('.dash-tab').forEach(t=> t.classList.toggle('active', t===tab));
    document.querySelectorAll('.dash-panel').forEach(p=> p.classList.toggle('active', p.id === target+'Panel'));
  });

  fetch('/api/trend/3day').then(r=>r.json()).then(d=> renderTrendPanel('trend3', d));
  fetch('/api/trend/5day').then(r=>r.json()).then(d=> renderTrendPanel('trend5', d));
  fetch('/api/latest-news').then(r=>r.json()).then(renderLatestNews);

  function renderTrendPanel(prefix, data){
    const body = document.getElementById(prefix+'Body');
    const countEl = document.getElementById(prefix+'Count');
    if(!data.available || !data.rows.length){
      body.innerHTML = '<div class="dash-empty">'+(data.available ? 'No stocks currently rising.' : 'Not configured.')+'</div>';
      countEl.textContent = '';
      return;
    }
    countEl.textContent = data.rows.length + ' stocks';
    const rowsHtml = data.rows.map((r,i)=>{
      const liveVal = liveCmpBySymbol[r.symbol];
      const cmp = fmtNum(liveVal !== undefined ? liveVal : (r.cmp !== null && r.cmp !== undefined ? r.cmp : r.last_price));
      const trendLabel = (r.trend || 'UpTrend').replace(/^[A-Z]\s*/, '').trim();
      return '<tr data-key="'+escapeAttr(r.symbol)+'">' +
        '<td>'+(i+1)+'</td>' +
        '<td><span class="sym">'+escapeHtml(r.symbol)+'</span>' + (r.name ? '<span class="cname">'+escapeHtml(r.name)+'</span>' : '') + '</td>' +
        '<td>▲ '+escapeHtml(trendLabel || 'UpTrend')+'</td>' +
        '<td class="num">'+fmtNum(r.support_high)+'</td>' +
        '<td class="num">'+fmtNum(r.support_low)+'</td>' +
        '<td class="num cmp-val" data-symbol="'+escapeAttr(r.symbol)+'">'+cmp+'</td>' +
        '<td class="num">'+fmtNum(r.last_price)+'</td>' +
      '</tr>';
    }).join('');
    body.innerHTML =
      '<table class="trend-table"><thead><tr>' +
        '<th>#</th><th>Symbol</th><th>Trend</th><th class="num">Support High</th><th class="num">Support Low</th><th class="num">CMP</th><th class="num">Last Price</th>' +
      '</tr></thead><tbody>'+rowsHtml+'</tbody></table>';
    body.querySelectorAll('tbody tr').forEach(el=>{
      el.addEventListener('click', ()=>{
        selectCompany(el.dataset.key);
        document.getElementById('main').scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  function renderLatestNews(list){
    const body = document.getElementById('latestNewsBody');
    const countEl = document.getElementById('latestNewsCount');
    if(!list.length){
      body.innerHTML = '<div class="dash-empty">No news yet.</div>';
      countEl.textContent = '';
      return;
    }
    countEl.textContent = list.length + ' items';
    body.innerHTML = list.map(n=>{
      const sent = (n.sentiment||'unknown').toLowerCase();
      const cat = n.category;
      return '<div class="news-row" data-key="'+escapeAttr(n.symbol || n.company)+'">' +
        '<div class="news-row-top">' +
          '<span class="news-row-company">'+escapeHtml(n.symbol || n.company)+'</span>' +
          '<span class="news-row-date">'+formatDate(n.date)+'</span>' +
        '</div>' +
        '<div class="news-row-tags">' +
          (cat ? '<span class="tag category '+cat+'">'+cat.replace(/_/g,' ')+'</span>' : '') +
          '<span class="tag sentiment '+sent+'">'+sent+'</span>' +
        '</div>' +
        '<div class="news-row-summary">'+escapeHtml(n.summary)+'</div>' +
      '</div>';
    }).join('');
    body.querySelectorAll('.news-row').forEach(el=>{
      el.addEventListener('click', ()=>{
        selectCompany(el.dataset.key);
        document.getElementById('main').scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  function buildTape(list){
    document.getElementById('tapeTrack').innerHTML = list.slice(0,30).map((e,i)=>{
      const cls = i % 3 === 0 ? 'down' : 'up';
      const arrow = i % 3 === 0 ? '▼' : '▲';
      const label = e.symbol ? e.symbol : e.name;
      return '<span>' + escapeHtml(label) + ' <span class="' + cls + '">' + arrow + '</span></span>';
    }).join('');
  }

  function buildTryChips(list){
    const picks = list.slice(0, 4);
    document.getElementById('tryRow').innerHTML = picks.map(e=>
      '<div class="try-chip" data-key="'+escapeAttr(e.symbol || e.name)+'">'+
        escapeHtml(e.symbol ? e.symbol + ' · ' + e.name : e.name)+
      '</div>'
    ).join('');
    document.getElementById('tryRow').addEventListener('click', e=>{
      const chip = e.target.closest('.try-chip');
      if(chip) selectCompany(chip.dataset.key);
    });
  }

  // ---- search ----
  let debounceTimer = null;
  qEl.addEventListener('input', ()=>{
    const val = qEl.value.trim();
    activeIndex = -1;
    if(!val){
      suggestEl.classList.remove('show');
      document.body.classList.remove('search-active');
      showIntro();
      return;
    }
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(()=>{
      fetch('/api/companies?q=' + encodeURIComponent(val))
        .then(r=>r.json())
        .then(matches=>{
          currentMatches = matches;
          renderSuggest(matches, val);
        });
    }, 120);
  });

  qEl.addEventListener('keydown', (e)=>{
    const items = suggestEl.querySelectorAll('.suggest-item');
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(items.length){ activeIndex = Math.min(activeIndex+1, items.length-1); updateActive(items); }
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(items.length){ activeIndex = Math.max(activeIndex-1, 0); updateActive(items); }
    } else if(e.key === 'Enter'){
      if(activeIndex >= 0 && currentMatches[activeIndex]) selectCompany(keyFor(currentMatches[activeIndex]));
      else if(currentMatches.length) selectCompany(keyFor(currentMatches[0]));
    } else if(e.key === 'Escape'){
      if(suggestEl.classList.contains('show')) suggestEl.classList.remove('show');
      else closeSearch();
    }
  });

  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.search-wrap')) suggestEl.classList.remove('show');
  });

  function updateActive(items){
    items.forEach((it,i)=> it.classList.toggle('active', i===activeIndex));
    if(items[activeIndex]) items[activeIndex].scrollIntoView({block:'nearest'});
  }

  function keyFor(m){ return m.symbol || m.name; }

  function renderSuggest(matches, val){
    if(!matches.length){
      suggestEl.innerHTML = '<div class="suggest-empty">No company or symbol matches “'+escapeHtml(val)+'”</div>';
      suggestEl.classList.add('show');
      return;
    }
    suggestEl.innerHTML = matches.map(m=>
      '<div class="suggest-item" data-key="'+escapeAttr(keyFor(m))+'">' +
        '<span class="suggest-left">' +
          (m.symbol ? '<span class="sym-badge">'+highlight(m.symbol,val)+'</span>' : '') +
          '<span class="name">'+highlight(m.name,val)+'</span>' +
        '</span>' +
        '<span class="cnt">'+m.count+' article'+(m.count===1?'':'s')+'</span></div>'
    ).join('');
    suggestEl.classList.add('show');
    suggestEl.querySelectorAll('.suggest-item').forEach(el=>{
      el.addEventListener('click', ()=> selectCompany(el.dataset.key));
    });
  }

  function highlight(text, val){
    const idx = text.toLowerCase().indexOf(val.toLowerCase());
    if(idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0,idx)) +
      '<strong style="color:var(--accent)">' + escapeHtml(text.slice(idx, idx+val.length)) + '</strong>' +
      escapeHtml(text.slice(idx+val.length));
  }

  function selectCompany(key){
    qEl.value = key;
    suggestEl.classList.remove('show');
    document.body.classList.add('search-active');
    main.innerHTML = '<div class="loading-state">Loading…</div>';
    fetch('/api/news/' + encodeURIComponent(key))
      .then(r=>r.json())
      .then(data=> renderResults(data));
  }

  function fmtNum(n){
    if(n === null || n === undefined || n === '') return '-';
    const num = Number(n);
    if(Number.isNaN(num)) return String(n);
    return num.toLocaleString('en-IN', {maximumFractionDigits:2});
  }

  // small "← Back to overview" pill shown at the top of every
  // company/news result, so there's an obvious way back besides the
  // tiny ✕ in the search box - especially important when a result was
  // opened by clicking a Latest News item rather than by typing.
  function backButtonHtml(){
    return '<div class="back-row">' +
      '<span class="back-btn" id="backToOverviewBtn">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>' +
        'Back to overview' +
      '</span>' +
    '</div>';
  }

  function wireBackButton(){
    const btn = document.getElementById('backToOverviewBtn');
    if(btn) btn.addEventListener('click', closeSearch);
  }

  function renderResults(data){
    const name = data.company;
    const symbol = data.symbol;
    const list = data.news || [];
    currentSymbol = symbol || null;

    let quoteHtml = '';
    const trend = data.trend;
    const trendBadgeHtml = trend
      ? '<span class="trend-badge '+trend.direction+'">'+escapeHtml(trend.label)+'</span>'
      : '';
    if(data.quote){
      const q = data.quote;
      const liveVal = symbol && liveCmpBySymbol[symbol];
      const cmpToShow = liveVal !== undefined ? liveVal : q.cmp;
      quoteHtml =
        '<div class="quote-card show" data-symbol="'+escapeAttr(symbol||'')+'">' +
          '<div class="quote-top">' +
            '<div class="quote-name">'+escapeHtml(name)+(symbol ? ' <span class="sym-badge">'+escapeHtml(symbol)+'</span>' : '')+(trendBadgeHtml ? ' '+trendBadgeHtml : '')+'</div>' +
            '<div class="quote-cmp" id="quoteCmpValue">'+fmtNum(cmpToShow)+'</div>' +
          '</div>' +
          '<div class="stat-row">' +
            '<div class="stat"><div class="label">5-Day Low</div><div class="value">'+fmtNum(q.low_5day)+'</div></div>' +
            '<div class="stat"><div class="label">20-Day Low</div><div class="value">'+fmtNum(q.low_20day)+'</div></div>' +
          '</div>' +
          '<div class="quote-note"><span class="live-dot" id="liveDot"></span><span id="liveNote">Live price (~15 min delayed)</span></div>' +
        '</div>';
    } else if(trendBadgeHtml){
      // no price data for this symbol, but we do have a trend - still
      // show a small badge so it's not lost
      quoteHtml =
        '<div class="quote-card show" data-symbol="'+escapeAttr(symbol||'')+'">' +
          '<div class="quote-top">' +
            '<div class="quote-name">'+escapeHtml(name)+(symbol ? ' <span class="sym-badge">'+escapeHtml(symbol)+'</span>' : '')+' '+trendBadgeHtml+'</div>' +
          '</div>' +
        '</div>';
    }

    if(!list.length){
      main.innerHTML = backButtonHtml() + quoteHtml + '<div class="empty-state">No news found for “'+escapeHtml(name)+'”.</div>';
      wireBackButton();
      return;
    }

    const cards = list.map(n=>{
      const sent = (n.sentiment||'unknown').toLowerCase();
      const cat = n.category;
      return '<div class="card">' +
        '<div class="dot '+sent+'"></div>' +
        '<div class="card-top">' +
          '<span class="date">'+formatDate(n.date)+'</span>' +
          (cat ? '<span class="tag category '+cat+'">'+cat.replace(/_/g,' ')+'</span>' : '') +
          '<span class="tag sentiment '+sent+'">'+sent+'</span>' +
        '</div>' +
        '<p class="summary">'+escapeHtml(n.summary)+'</p>' +
      '</div>';
    }).join('');

    main.innerHTML = backButtonHtml() + quoteHtml +
      '<div class="result-head">' +
        '<h2>Latest news</h2>' +
        '<span class="result-count">'+list.length+' article'+(list.length===1?'':'s')+' · latest → oldest</span>' +
      '</div>' +
      '<div class="feed">'+cards+'</div>';
    wireBackButton();
  }

  function formatDate(iso){
    const [y,m,d] = iso.split('-');
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d + ' ' + months[parseInt(m,10)-1] + ' ' + y;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // ---- live CMP over WebSocket ----
  // Server pushes a batch of {symbol: price} every poll cycle (see
  // POLL_INTERVAL_SECONDS in app.py). We only ever update numbers
  // already on screen - never trigger a re-render/reflow - so this
  // never disturbs scroll position or an open news feed.
  const socket = io();

  socket.on('price_update', (payload)=>{
    const prices = payload.prices || {};
    for(const symbol in prices){
      liveCmpBySymbol[symbol] = prices[symbol];
    }

    // 1) the big quote-card CMP, if the company currently open has a live price
    if(currentSymbol && prices.hasOwnProperty(currentSymbol)){
      const el = document.getElementById('quoteCmpValue');
      if(el){
        const oldVal = parseFloat((el.textContent||'').replace(/,/g,''));
        const newVal = prices[currentSymbol];
        el.textContent = fmtNum(newVal);
        flashChange(el, oldVal, newVal);
      }
    }

    // 2) any visible trend-table CMP cells for symbols that just updated
    document.querySelectorAll('.cmp-val[data-symbol]').forEach(cell=>{
      const sym = cell.dataset.symbol;
      if(prices.hasOwnProperty(sym)){
        const oldVal = parseFloat((cell.textContent||'').replace(/,/g,''));
        const newVal = prices[sym];
        cell.textContent = fmtNum(newVal);
        flashChange(cell, oldVal, newVal);
      }
    });
  });

  socket.on('connect', ()=>{
    const dot = document.getElementById('liveDot');
    if(dot) dot.classList.remove('stale');
  });
  socket.on('disconnect', ()=>{
    const dot = document.getElementById('liveDot');
    const note = document.getElementById('liveNote');
    if(dot) dot.classList.add('stale');
    if(note) note.textContent = 'Live feed disconnected - showing last known price';
  });

  function flashChange(el, oldVal, newVal){
    el.classList.remove('flash-up','flash-down');
    if(!Number.isNaN(oldVal) && !Number.isNaN(newVal) && newVal !== oldVal){
      void el.offsetWidth; // restart animation
      el.classList.add(newVal > oldVal ? 'flash-up' : 'flash-down');
    }
  }
})();
</script>
</body>
