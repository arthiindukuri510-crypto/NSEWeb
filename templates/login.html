<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · NSE Company Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel-2:#171c22; --line:#242b33;
    --text:#e7eaee; --muted:#8a94a1; --accent:#3ddc97; --neg:#ff5d5d; --brand:#5aa9ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(90,169,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(61,220,151,0.08), transparent 55%),
      var(--bg);
    color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line);
    border-radius:18px; padding:28px 26px 26px; box-shadow:0 24px 60px rgba(0,0,0,0.45);
  }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--brand); text-align:center; }
  h1{ font-family:'Archivo',sans-serif; font-weight:700; font-size:22px; margin:6px 0 20px; text-align:center; }
  h1 .hl{ color:var(--accent); }

  .tabs{ display:flex; gap:6px; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:4px; margin-bottom:20px; }
  .tabs button{
    flex:1; background:none; border:none; color:var(--muted); font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:13px; padding:9px 6px; border-radius:8px; cursor:pointer; transition:all .12s ease;
  }
  .tabs button:hover{ color:var(--text); }
  .tabs button.active{ background:rgba(61,220,151,0.12); color:var(--accent); }

  form{ display:none; }
  form.active{ display:block; }
  label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; }
  input{
    width:100%; background:#0f1420; border:1px solid var(--line); border-radius:10px; color:var(--text);
    font-size:15px; font-family:'Inter',sans-serif; padding:12px 14px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(61,220,151,0.14); }
  input::placeholder{ color:#5b6572; }
  input:disabled{ opacity:.5; cursor:not-allowed; }

  /* show / hide password (eye icon) */
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:48px; }
  .eye{
    position:absolute; right:6px; top:50%; transform:translateY(-50%); display:flex; align-items:center;
    justify-content:center; width:36px; height:36px; background:none; border:none; border-radius:8px;
    color:var(--muted); cursor:pointer; transition:color .12s ease, background .12s ease;
  }
  .eye:hover{ color:var(--text); background:var(--panel-2); }
  .eye.on{ color:var(--accent); }

  /* phone + send-otp row */
  .phone-row{ display:flex; gap:8px; }
  .phone-row input{ flex:1; }
  .otp-btn{
    flex-shrink:0; background:var(--panel-2); color:var(--brand); border:1px solid var(--line);
    border-radius:10px; padding:0 14px; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:12.5px; cursor:pointer; white-space:nowrap; transition:all .12s ease;
  }
  .otp-btn:hover{ border-color:var(--brand); }
  .otp-btn:disabled{ opacity:.5; cursor:default; }
  .otp-btn.verified{ color:var(--accent); border-color:var(--accent); background:rgba(61,220,151,0.1); cursor:default; }

  #otp-section{ display:none; }
  #otp-section.show{ display:block; }

  .submit{
    width:100%; margin-top:20px; background:rgba(61,220,151,0.12); color:var(--accent);
    border:1px solid var(--accent); border-radius:10px; padding:12px; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:14.5px; cursor:pointer; transition:all .12s ease;
  }
  .submit:hover{ background:rgba(61,220,151,0.22); }
  .submit:disabled{ opacity:.55; cursor:default; }

  .msg{ min-height:20px; margin-top:16px; font-size:13.5px; line-height:1.45; text-align:center; }
  .msg.err{ color:var(--neg); }
  .msg.ok{ color:var(--accent); }
  .hint{ color:var(--muted); font-size:12.5px; margin-top:12px; text-align:center; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Company Terminal</div>
    <h1>NSE <span class="hl">Company Terminal</span></h1>

    <div class="tabs" id="tabs">
      <button type="button" data-tab="login" class="active">User Login</button>
      <button type="button" data-tab="register">Register</button>
      <button type="button" data-tab="admin">Admin</button>
    </div>

    <form id="login" class="active" autocomplete="on">
      <label for="l_id">Name or phone number</label>
      <input id="l_id" name="username" type="text" autocomplete="username" placeholder="Your name or 10-digit phone" required>
      <label for="l_pw">Password</label>
      <input id="l_pw" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="submit" type="submit">Log in</button>
    </form>

    <form id="register" autocomplete="on">
      <label for="r_name">Name</label>
      <input id="r_name" type="text" autocomplete="name" placeholder="Your full name" required>

      <label for="r_phone">Phone number</label>
      <div class="phone-row">
        <input id="r_phone" type="tel" autocomplete="tel" placeholder="10-digit phone number" required>
        <button type="button" class="otp-btn" id="send-otp-btn">Send OTP</button>
      </div>

      <div id="otp-section">
        <label for="r_otp">Enter OTP</label>
        <div class="phone-row">
          <input id="r_otp" type="text" inputmode="numeric" placeholder="6-digit code" maxlength="6">
          <button type="button" class="otp-btn" id="verify-otp-btn">Verify</button>
        </div>
      </div>

      <label for="r_pw">Password</label>
      <input id="r_pw" type="password" autocomplete="new-password" placeholder="At least 6 characters" required disabled>
      <label for="r_pw2">Confirm password</label>
      <input id="r_pw2" type="password" autocomplete="new-password" placeholder="Type the password again" required disabled>
      <button class="submit" type="submit" id="register-submit" disabled>Verify phone to continue</button>
      <div class="hint">Your name must be unique - you can log in with your name or your phone number.</div>
      <div id="recaptcha-container"></div>
    </form>

    <form id="admin" autocomplete="off">
      <label for="a_pw">Admin password</label>
      <input id="a_pw" type="password" autocomplete="current-password" placeholder="Admin password" required>
      <button class="submit" type="submit">Admin log in</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCrUP2qWDjcFReoG2ap84P6FKUX-UW3WQ8",
    authDomain: "flumagic-903db.firebaseapp.com",
    projectId: "flumagic-903db",
    storageBucket: "flumagic-903db.firebasestorage.app",
    messagingSenderId: "440089082800",
    appId: "1:440089082800:web:12f255a8e26f4e861e3475"
  };
  firebase.initializeApp(firebaseConfig);
</script>

<script>
(function(){
  const msg = document.getElementById('msg');

  function say(text, kind){
    msg.textContent = text || '';
    msg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  // ---- eye icon: show / hide password ----
  const EYE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  document.querySelectorAll('input[type="password"]').forEach(input=>{
    const wrap = document.createElement('div');
    wrap.className = 'pw-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'eye';
    btn.title = 'Show password';
    btn.setAttribute('aria-label', 'Show password');
    btn.innerHTML = EYE;
    btn.addEventListener('click', ()=>{
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_OFF : EYE;
      btn.classList.toggle('on', show);
      btn.title = show ? 'Hide password' : 'Show password';
      btn.setAttribute('aria-label', btn.title);
    });
    wrap.appendChild(btn);
  });

  function showTab(name){
    document.querySelectorAll('#tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('form').forEach(f=> f.classList.toggle('active', f.id === name));
    say('');
  }
  document.getElementById('tabs').addEventListener('click', e=>{
    const b = e.target.closest('button');
    if(b) showTab(b.dataset.tab);
  });

  async function post(url, data){
    const r = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    let j = {};
    try { j = await r.json(); } catch(e) {}
    return {status: r.status, data: j};
  }

  async function submit(form, url, data, onOk){
    const btn = form.querySelector('.submit');
    btn.disabled = true;
    say('Please wait…');
    try{
      const res = await post(url, data);
      if(res.data && res.data.ok){ onOk(res.data); }
      else { say((res.data && res.data.error) || 'Something went wrong. Please try again.', 'err'); }
    } catch(e){
      say('Network problem. Please try again.', 'err');
    }
    btn.disabled = false;
  }

  document.getElementById('login').addEventListener('submit', e=>{
    e.preventDefault();
    submit(e.target, '/api/login', {
      mode: 'user',
      identifier: document.getElementById('l_id').value,
      password: document.getElementById('l_pw').value
    }, ()=>{ window.location.href = '/'; });
  });

  document.getElementById('admin').addEventListener('submit', e=>{
    e.preventDefault();
    submit(e.target, '/api/login', {
      mode: 'admin',
      password: document.getElementById('a_pw').value
    }, ()=>{ window.location.href = '/'; });
  });

  // ---------------- Firebase phone OTP (register tab) ----------------
  let confirmationResult = null;
  let firebaseIdToken = null;
  let recaptchaVerifier = null;

  const phoneInput   = document.getElementById('r_phone');
  const sendBtn      = document.getElementById('send-otp-btn');
  const otpSection   = document.getElementById('otp-section');
  const otpInput     = document.getElementById('r_otp');
  const verifyBtn    = document.getElementById('verify-otp-btn');
  const pwInput      = document.getElementById('r_pw');
  const pw2Input     = document.getElementById('r_pw2');
  const registerBtn  = document.getElementById('register-submit');

  function getRecaptcha(){
    if(!recaptchaVerifier){
      recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
    }
    return recaptchaVerifier;
  }

  sendBtn.addEventListener('click', async ()=>{
    const digits = phoneInput.value.replace(/\D/g,'');
    if(digits.length < 10){ say('Enter a valid 10-digit phone number.', 'err'); return; }
    const phone = '+91' + digits.slice(-10);

    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending…';
    say('');
    try{
      confirmationResult = await firebase.auth().signInWithPhoneNumber(phone, getRecaptcha());
      otpSection.classList.add('show');
      say('OTP sent. Enter the code below.', 'ok');
      sendBtn.textContent = 'Resend OTP';
    } catch(err){
      say('Failed to send OTP: ' + err.message, 'err');
      sendBtn.textContent = 'Send OTP';
    }
    sendBtn.disabled = false;
  });

  verifyBtn.addEventListener('click', async ()=>{
    const code = otpInput.value.trim();
    if(!confirmationResult){ say('Please send the OTP first.', 'err'); return; }
    if(code.length < 6){ say('Enter the 6-digit OTP.', 'err'); return; }

    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Verifying…';
    try{
      const result = await confirmationResult.confirm(code);
      firebaseIdToken = await result.user.getIdToken();

      // lock phone, unlock the rest of the form
      phoneInput.disabled = true;
      sendBtn.disabled = true;
      otpInput.disabled = true;
      verifyBtn.textContent = 'Verified';
      verifyBtn.classList.add('verified');
      pwInput.disabled = false;
      pw2Input.disabled = false;
      registerBtn.disabled = false;
      registerBtn.textContent = 'Create account';
      say('Phone verified.', 'ok');
    } catch(err){
      say('Invalid OTP: ' + err.message, 'err');
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'Verify';
    }
  });

  document.getElementById('register').addEventListener('submit', e=>{
    e.preventDefault();
    if(!firebaseIdToken){ say('Please verify your phone number first.', 'err'); return; }

    const pw = pwInput.value;
    const pw2 = pw2Input.value;
    const phone = phoneInput.value;
    if(pw !== pw2){ say('Passwords do not match.', 'err'); return; }
    if(pw.length < 6){ say('Password must be at least 6 characters.', 'err'); return; }

    submit(e.target, '/api/register', {
      name: document.getElementById('r_name').value,
      phone: phone,
      password: pw,
      confirm: pw2,
      firebase_token: firebaseIdToken
    }, (d)=>{
      e.target.reset();
      showTab('login');
      document.getElementById('l_id').value = d.phone || '';
      document.getElementById('l_pw').focus();
      say('Account created. Please log in.', 'ok');
    });
  });
})();
</script>
</body>
</html>
